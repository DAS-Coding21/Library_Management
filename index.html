<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="bg-container">
        <div class="bg-image d-flex flex-column justify-content-center align-items-center p-3 text-center">
            <h1 class="heading">Library Management</h1>
            <input type="search" id="searchInput" class="search-input mt-2 p-2" placeholder="Type book title">
        </div>
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div id="searchResults" class="book-section-container pt-3 p-2">
                        <div class="text-center mt-3">
                            <div id="spinner" class="spinner-border d-none" role="status">
                                <span class="sr-only"></span>
                            </div>
                        </div>
                        <h1 id="popularBookHeading" class="popular-books-heading d-none">Popular Books</h1>
                        <h1 id="noResultsFound" class="no-results-found d-none">No results found</h1>
                        <div id="popularBooksContainer" class="popular-books-container">

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
